services:
  warp-web:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:?请在 .env 设置至少16字符的注册口令}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
